# Google Play screenshots on a GitHub-hosted Linux runner.
#
# Builds a release APK (prebuild + Gradle, x86_64 only, no EAS), boots an
# emulator with a Pixel 9 Pro screen (the 1280x2856 goldie's pixel-10-pro
# frame expects) and plays the explore flows behind the goldie scenes. The raw
# captures are the run's artifact; they are framed with `goldie frame` like
# the iOS ones.
#
# Its own workflow and concurrency group, so it never cancels an iOS run.
name: Store screenshots (Android)

on:
  # A workflow that is not on the default branch yet can only start on push.
  push:
    branches: [chore/play-screenshots]
  workflow_dispatch:
    inputs:
      flows:
        description: "Space-separated explore flows to play (blank: the goldie scenes)"
        default: ""

concurrency:
  group: play-screenshots
  cancel-in-progress: true

env:
  BUNDLE_ID: com.sdcomputronix.ziphrmsmobile
  EAS_BUILD_PROFILE: production
  EXPO_UPDATES_TARGET: build
  EXPO_PUBLIC_API_URL: https://api.zobconnect.com
  EXPO_PUBLIC_WEB_URL: https://web.zobconnect.com
  ARGENT_SECRET_REVIEW_PASSWORD: ${{ secrets.REVIEW_PASSWORD }}
  ARGENT_EMULATOR_NO_WINDOW: "1"

jobs:
  screenshots:
    # 24.04 for glibc 2.39, which argent's gesture and screenshot tools need.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the APK
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: build-apk
          key: apk-x86_64-${{ hashFiles('package-lock.json', 'app.json', 'app.config.js', 'eas.json', 'plugins/**', 'modules/**', 'assets/**', 'src/**', 'index.ts', 'App.tsx') }}

      # Release lint (lintVitalAnalyzeRelease, once per native module) ran the
      # JVM out of Metaspace, and the dying JVM then held the step until the
      # job timed out. It guards store uploads, not screenshots, so it is
      # skipped; the larger heap is for the rest of the build. The timeout
      # turns any further hang into a failure with a log.
      - name: Build the release APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: |
          npm ci
          CI=1 npx expo prebuild --platform android --clean
          mkdir -p out
          cd android
          if ! ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease \
              -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g" --no-daemon > ../out/gradle.log 2>&1; then
            grep -n -E "error:|FAILURE|What went wrong" -A6 ../out/gradle.log | head -150
            tail -n 40 ../out/gradle.log
            exit 1
          fi
          cd ..
          mkdir -p build-apk
          cp android/app/build/outputs/apk/release/app-release.apk build-apk/
          ls -l build-apk

      # Saved now rather than at the end of the job, which only happens when
      # every step passes: a failed capture should not cost a rebuild.
      - name: Save the APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-apk
          key: ${{ steps.apk-cache.outputs.cache-primary-key }}

      - name: Install tools
        run: |
          npm i -g @swmansion/argent@latest
          argent telemetry disable || true

      # The AVD is made here and booted by argent itself. Under
      # reactivecircus/android-emulator-runner, argent's input server could
      # not find the emulator it had not launched ("Failed to find any
      # running emulator"), so every tap failed.
      #
      # The runner's avdmanager predates the pixel_9_pro profile, so the AVD
      # is made from an older Pixel and given the 9 Pro's screen before it
      # boots: 1280x2856, the size goldie's frame expects.
      - name: Create a Pixel 9 Pro-sized AVD
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$SDKM/sdkmanager" --licenses > /dev/null || true
          "$SDKM/sdkmanager" --install emulator platform-tools "system-images;android-35;google_apis;x86_64" > /dev/null
          echo no | "$SDKM/avdmanager" create avd --force -n test --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          # Wherever this runner keeps AVDs (ANDROID_AVD_HOME, ANDROID_USER_HOME...).
          CFG="$("$SDKM/avdmanager" list avd 2>/dev/null | awk '/Path:/ && /test\.avd/ {print $2; exit}')/config.ini"
          echo "AVD config: $CFG"; env | grep -E '^ANDROID_(AVD|USER|SDK|EMULATOR)_HOME' || true
          sed -i -E '/^(hw\.lcd\.(width|height|density)|skin\.(name|path)|hw\.ramSize|disk\.dataPartition\.size|hw\.keyboard)=/d' "$CFG"
          printf 'hw.lcd.width=1280\nhw.lcd.height=2856\nhw.lcd.density=480\nskin.name=1280x2856\nskin.path=_no_skin\nhw.ramSize=4096\ndisk.dataPartition.size=6G\nhw.keyboard=no\n' >> "$CFG"
          grep -E '^(hw\.lcd|skin|hw\.ramSize|disk)' "$CFG"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Capture on the emulator
        env:
          ARGENT_EMULATOR_GPU_MODE: swiftshader_indirect
        run: |
          mkdir -p out/android
          argent server start --detach >> out/android/setup.txt 2>&1 || true
          argent run boot-device --avdName test --bootTimeoutMs 600000 >> out/android/setup.txt 2>&1
          SERIAL=$(adb devices | awk '/^emulator-/{print $1; exit}')
          echo "serial: $SERIAL" | tee -a out/android/setup.txt
          [ -n "$SERIAL" ] || { tail -40 out/android/setup.txt; exit 1; }
          # Which emulators argent's input server can see, for the next failure.
          ls -la "${XDG_RUNTIME_DIR:-/nonexistent}/avd/running" "$HOME/.android/avd/running" 2>&1 | tee -a out/android/setup.txt || true
          for k in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb -s "$SERIAL" shell settings put global $k 0
          done
          adb -s "$SERIAL" shell wm size | tee -a out/android/setup.txt
          FLOWS="${{ inputs.flows }}" bash scripts/store-screenshots/android-explore.sh "$SERIAL" out/android "$PWD/build-apk/app-release.apk"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-screenshots
          path: |
            out/android
            out/gradle.log
          if-no-files-found: ignore
          retention-days: 14

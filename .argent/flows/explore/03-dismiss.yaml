executionPrerequisite: Signed in; a system prompt or the app tour may be showing.
steps:
  - when: { visible: { text: Allow } }
    steps:
      - tap: { text: Allow }
  - wait: 1500
  - when: { visible: { text: Skip } }
    steps:
      - tap: { text: Skip }
  - wait: 1500
  - await: { idle: true }

executionPrerequisite: App on the login screen.
steps:
  - type: { into: { id: login-employee-id }, text: EMP-90002, submit: false }
  - echo: Return on the password field dismisses the keyboard so the button is reachable
  - type: { into: { id: login-password }, text: "{{secret:REVIEW_PASSWORD}}", submit: true }
  - echo: The button comes after the password field; the screen title has the same words
  - tap: { text: Sign in, after: { id: login-password } }
  - wait: 8000

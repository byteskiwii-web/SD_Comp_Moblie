steps:
  - launch: com.sdcomputronix.ziphrmsmobile
  - await: { visible: { id: login-employee-id }, timeout: 30000 }
  - type: { into: { id: login-employee-id }, text: EMP-90002, submit: false }
  - echo: Return on the password field dismisses the keyboard so the button is reachable
  - type: { into: { id: login-password }, text: "{{secret:REVIEW_PASSWORD}}", submit: true }
  - echo: The button follows the password field; the screen title has the same words
  - tap: { text: Sign in, after: { id: login-password } }
  - echo: Fails here, not in the next flow, when the sign-in did not take
  - await: { visible: { text: Home }, timeout: 30000 }
